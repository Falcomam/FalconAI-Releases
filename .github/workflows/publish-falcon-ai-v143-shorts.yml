name: Verify and publish Falcon AI V14.3.0 Shorts Money Mode
on:
  push:
    branches: ['release/v14.3-money-mode']
    paths:
      - ".github/workflows/publish-falcon-ai-v143-shorts.yml"
      - "packaging/prepare_v143_shorts_candidate.py"
      - "packaging/stage_shorts.py"
      - "packaging/shorts*.py"
      - "packaging/tests/test_shorts*.py"
permissions:
  contents: write
concurrency:
  group: falcon-v143-shorts-release
  cancel-in-progress: false
jobs:
  verify-v14-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Falcon Ai source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and test bundled 13.8 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install pyinstaller==6.16.0 "Pillow>=11.0"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tools failed' }
          foreach ($patch in @('v13.6','v13.6.1','v13.6.2','v13.6.3','v13.6.4','v13.6.5')) {
            python "patches/$patch/apply.py"
            if ($LASTEXITCODE -ne 0) { throw "Base patch failed: $patch" }
          }
          python packaging/prepare.py
          if ($LASTEXITCODE -ne 0) { throw '13.7.0 base reconstruction failed' }
          python packaging/prepare_icon_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Verified purple icon reconstruction failed' }
          python packaging/prepare_engine_candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'Local engine integration failed' }
          python packaging/prepare_single_chat_candidate.py
          if ($LASTEXITCODE -ne 0) { throw 'Single-chat coding integration failed' }
          python packaging/prepare_v138_release.py
          if ($LASTEXITCODE -ne 0) { throw '13.8 base reconstruction failed' }
          foreach ($script in @(
            'packaging/prepare_copy_reply_candidate.py',
            'packaging/prepare_command_palette_candidate.py',
            'packaging/prepare_web_quality_candidate.py',
            'packaging/prepare_project_revision_candidate.py',
            'packaging/prepare_project_browser_candidate.py',
            'packaging/prepare_next_bundle_windows.py')) {
            python $script
            if ($LASTEXITCODE -ne 0) { throw "New bundled stage failed: $script" }
          }
          foreach ($script in @('packaging/prepare_project_search_candidate.py', 'packaging/prepare_quiet_powershell_candidate.py', 'packaging/prepare_packaged_health_candidate.py', 'packaging/finalize_packaged_health_release.py', 'packaging/prepare_v14_release_candidate.py', 'packaging/prepare_agent_coding_candidate.py', 'packaging/prepare_money_mode_candidate.py', 'packaging/prepare_v141_money_release_candidate.py', 'packaging/prepare_v142_store_candidate.py', 'packaging/prepare_v143_shorts_candidate.py')) {
            python $script
            if ($LASTEXITCODE -ne 0) { throw "14.3.0 staging failed: $script" }
          }
          python -m pip install -r build/Falcon_Ai_V14_3_Candidate/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Falcon dependencies failed' }
          foreach ($test in @('test_packaged_diagnostics.py', 'test_packaged_improve_guard.py', 'test_project_search.py', 'test_project_search_chat.py', 'test_quiet_powershell.py')) {
            python -m unittest discover -s packaging/tests -p $test -v
            if ($LASTEXITCODE -ne 0) { throw "New health regression failed: $test" }
          }
          python -m unittest discover -s packaging/tests -p 'test_developer*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Developer Mode tests failed' }
          python -m unittest discover -s packaging/tests -p test_engine_manager.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Ollama manager tests failed' }
          foreach ($test in @(
            'test_message_copy.py','test_command_palette.py',
            'test_html_quality.py','test_project_revision.py',
            'test_project_revision_chat.py','test_project_browser.py',
            'test_project_browser_chat.py', 'test_gaming_mode.py',
            'test_site_design_check.py', 'test_falcon_foundation.py',
            'test_v14_release_checks.py', 'test_project_targeted_edits.py',
            'test_project_targeted_chat.py')) {
            python -m unittest discover -s packaging/tests -p $test -v
            if ($LASTEXITCODE -ne 0) { throw "New feature regression failed: $test" }
          }
          foreach ($test in @('test_money_mode.py','test_money_integrations.py','test_customer_faq.py','test_money_mode_chat.py','test_payhip_store.py','test_website_preview.py','test_payhip_browser_agent.py')) {
            python -m unittest discover -s packaging/tests -p $test -v
            if ($LASTEXITCODE -ne 0) { throw "Money Mode regression failed: $test" }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation on CI failed' }
            $env:PATH += ';C:\ProgramData\chocolatey\bin'
          }
          ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg unavailable' }
          ffprobe -version
          if ($LASTEXITCODE -ne 0) { throw 'FFprobe unavailable' }
          python -m unittest discover -s packaging/tests -p 'test_shorts*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Shorts source, media or native speech test failed' }
          python -m compileall -q build/Falcon_Ai_V14_3_Candidate
          if ($LASTEXITCODE -ne 0) { throw 'Bundled source compile failed' }
          python -m py_compile build/falcon_app_v143_runtime/app_entry.py build/falcon_app_v143_runtime/app_updates.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaged entry/updater compile failed' }
          @'
          import pathlib
          source = pathlib.Path("build/Falcon_Ai_V14_3_Candidate")
          runtime = pathlib.Path("build/falcon_app_v143_runtime")
          assert (source/"RELEASE_VERSION.txt").read_text().strip() == "14.3.0"
          assert (pathlib.Path("build/Falcon_Ai_App_V13_8_0")/"RELEASE_VERSION.txt").read_text().strip() == "13.8.0"
          assert (source/"README_FALCON_AI_V14_2.txt").exists()
          assert (source/"README_FALCON_AI_V14_3.txt").exists()
          assert all((source/m).exists() for m in ("shorts_mode.py", "shorts_report.py", "shorts_controls.py", "shorts_publish_ui.py", "payhip_browser_agent.py"))
          assert "def _setup_money_mode(self):" in (source/"developer_chat.py").read_text(encoding="utf-8")
          assert not (source/"NEXT_BUNDLE_TEST_CANDIDATE_ONLY.txt").exists()
          assert all((source/module).exists() for module in ("money_mode.py", "money_integrations.py", "customer_faq.py", "project_coding_agent.py"))
          assert "/money" in (source/"developer_chat.py").read_text(encoding="utf-8")
          assert all((source/mod).exists() for mod in ("payhip_store.py","website_preview.py"))
          assert "payhip_store" in (source/"developer_chat.py").read_text(encoding="utf-8")
          assert all((source/module).exists() for module in (
              "message_copy.py","command_palette.py","html_quality.py",
              "project_revision.py","project_browser.py",
              "gaming_mode.py","falcon_foundation.py","site_design_check.py"))
          assert "CURRENT_VERSION = (14, 3, 0)" in (runtime/"app_updates.py").read_text()
          assert "CURRENT_VERSION != (14, 3, 0)" in (runtime/"app_entry.py").read_text()
          assert "MyAppVersion \"14.3.0\"" in (runtime/"Falcon_Ai.iss").read_text()
          assert "Falcon_Ai_Icon.ico" in (runtime/"Falcon_Ai.iss").read_text()
          gui=(source/"falcon.py").read_text(encoding="utf-8")
          assert "self.dev_chat.dispatch(prompt)" in gui
          assert "self.dev_chat.stop()" in gui
          assert "developer_chat.gaming_mode.enabled()" in gui
          assert "Gaming Mode ON (free VRAM)" in gui
          assert "V14.3.0" in gui
          assert "message_copy.attach_copy_reply(" in gui
          assert "command_palette.EntryController(" in gui
          assert "engine_manager" in gui
          assert "sys.modules[\'diagnostics\'] = packaged_diagnostics" in (runtime/"app_entry.py").read_text()
          print("PASS: source, releases and updater version identity consistent; one chat retained")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Release identity test failed' }
      - name: Run real Chromium website QA
        shell: pwsh
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Browser runner installation failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
          python -m unittest discover -s packaging/tests -p test_customer_faq_browser.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Real customer FAQ browser tests failed' }
      - name: Build frozen candidate Windows Falcon Ai.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (Resolve-Path 'build/Falcon_Ai_V14_3_Candidate').Path
          $runtime = (Resolve-Path 'build/falcon_app_v143_runtime').Path
          $args = @(
            '--noconfirm','--clean','--windowed','--onedir',
            '--name','Falcon Ai',
            '--distpath','dist','--workpath','build/pyinstaller',
            '--specpath','build/pyinstaller',
            '--add-data',((Resolve-Path 'packaging/app_update_restart.ps1').Path + ';.'),
            '--add-data',($source + '\RELEASE_VERSION.txt;.'),
            '--add-data',($runtime + '\Falcon_Ai_Icon.png;.'),
            '--icon',($runtime + '\Falcon_Ai_Icon.ico'),
            '--hidden-import=winotify','--hidden-import=pyautogui',
            '--hidden-import=PIL.Image','--collect-all=pyautogui','--collect-all=playwright'
          )
          Get-ChildItem -LiteralPath $source -Filter '*.py' -File | ForEach-Object {
            $args += @('--add-data',($_.FullName + ';.'))
            if ($_.BaseName -notin @('sandbox_runner')) {
              $args += ('--hidden-import=' + $_.BaseName)
            }
          }
          $env:PYTHONPATH = $source + [IO.Path]::PathSeparator + $runtime
          $args += (Join-Path $runtime 'app_entry.py')
          python -m PyInstaller @args
          if ($LASTEXITCODE -ne 0) { throw 'Falcon Ai Windows EXE build failed' }
          $exe = (Resolve-Path 'dist/Falcon Ai/Falcon Ai.exe').Path
          $test = Start-Process -FilePath $exe -ArgumentList '--falcon-self-test' -PassThru -Wait
          if ($test.ExitCode -ne 0) { throw ('Frozen self-test failed: ' + $test.ExitCode) }
          $health = Start-Process -FilePath $exe -ArgumentList '--falcon-diagnostics-self-test' -PassThru -Wait
          if ($health.ExitCode -ne 0) { throw 'Packaged diagnostics failed' }
          $foundation = Start-Process -FilePath $exe -ArgumentList '--falcon-foundation-self-test' -PassThru -Wait
          if ($foundation.ExitCode -ne 0) { throw 'Frozen V14 foundation self-test failed' }
          $money = Start-Process -FilePath $exe -ArgumentList '--falcon-money-self-test' -PassThru -Wait
          if ($money.ExitCode -ne 0) { throw 'Frozen Money Mode self-test failed' }
          $store = Start-Process -FilePath $exe -ArgumentList '--falcon-store-self-test' -PassThru -Wait
          if ($store.ExitCode -ne 0) { throw 'Frozen Payhip Store self-test failed' }
          $shorts = Start-Process -FilePath $exe -ArgumentList '--falcon-shorts-self-test' -PassThru -Wait
          if ($shorts.ExitCode -ne 0) { throw 'Packaged Shorts self-test failed' }
          $folder = Join-Path $env:LOCALAPPDATA 'FalconAI\v13_5_diagnostics'
          $report = Get-ChildItem -LiteralPath $folder -Filter 'check_*.json' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $report) { throw 'Packaged report missing' }
          $checks = @((Get-Content -LiteralPath $report.FullName -Raw | ConvertFrom-Json).checks.PSObject.Properties)
          if ($checks.Count -ne 13 -or @($checks | Where-Object { $_.Value -ne 'present' }).Count -gt 0) { throw 'Packaged diagnostics not 13/13' }
          Write-Host 'PASS: frozen 14.3.0 application and packaged diagnostics'
      - name: Compile candidate installer and test clean installation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup -y --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          Copy-Item -LiteralPath 'build/falcon_app_v143_runtime/Falcon_Ai.iss' -Destination 'Falcon_Ai.iss'
          & $compiler 'Falcon_Ai.iss'
          if ($LASTEXITCODE -ne 0) { throw 'V14.3.0 installer compilation failed' }
          $setup = (Resolve-Path 'output/Falcon_Ai_Setup.exe').Path
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw ('Clean install failed ' + $p.ExitCode) }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Falcon Ai\Falcon Ai.exe'
          $oldHelper = Join-Path $env:LOCALAPPDATA 'Programs\Falcon Ai\_internal\app_update_restart.ps1'
          if (-not (Test-Path -LiteralPath $installed) -or -not (Test-Path -LiteralPath $oldHelper)) {
            throw 'Installed EXE or updater helper missing'
          }
          $q = Start-Process -FilePath $installed -ArgumentList '--falcon-self-test' -PassThru -Wait
          if ($q.ExitCode -ne 0) { throw 'Clean installed EXE self-test failed' }
          $foundation = Start-Process -FilePath $installed -ArgumentList '--falcon-foundation-self-test' -PassThru -Wait
          if ($foundation.ExitCode -ne 0) { throw 'Clean installed V14 foundation self-test failed' }
          $money = Start-Process -FilePath $installed -ArgumentList '--falcon-money-self-test' -PassThru -Wait
          if ($money.ExitCode -ne 0) { throw 'Installed Money Mode self-test failed' }
          $store = Start-Process -FilePath $installed -ArgumentList '--falcon-store-self-test' -PassThru -Wait
          if ($store.ExitCode -ne 0) { throw 'Installed Payhip Store self-test failed' }
          $shorts = Start-Process -FilePath $installed -ArgumentList '--falcon-shorts-self-test' -PassThru -Wait
          if ($shorts.ExitCode -ne 0) { throw 'Packaged Shorts self-test failed' }
          $version = Join-Path $env:LOCALAPPDATA 'Programs\Falcon Ai\_internal\RELEASE_VERSION.txt'
          if ((Get-Content -LiteralPath $version -Raw).Trim() -ne '14.3.0') { throw 'Incorrect installed version' }
          Write-Host 'PASS: clean install and Windows EXE self-test'
      - name: Test 14.2.0 to internal candidate upgrade and auto-relaunch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appDir = Join-Path $env:LOCALAPPDATA 'Programs\Falcon Ai'
          $newSetup = (Resolve-Path 'output/Falcon_Ai_Setup.exe').Path
          $unins = Get-ChildItem -LiteralPath $appDir -Filter 'unins*.exe' -File | Select-Object -First 1
          if (-not $unins) { throw 'New installer did not add Windows uninstaller' }
          $u = Start-Process -FilePath $unins.FullName -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw 'CI uninstall failed' }

          $oldDir = Join-Path $env:RUNNER_TEMP 'old_falcon_release'
          New-Item -Path $oldDir -ItemType Directory -Force | Out-Null
          gh release download v14.2.0 -p Falcon_Ai_Setup.exe -D $oldDir --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Verified 14.2.0 release asset missing' }
          $oldSetup = Join-Path $oldDir 'Falcon_Ai_Setup.exe'
          $remote = gh api repos/Falcomam/FalconAI-Releases/releases/tags/v14.2.0 --jq '.assets[] | select(.name == "Falcon_Ai_Setup.exe") | .digest'
          if ($LASTEXITCODE -ne 0 -or -not $remote) { throw 'Old installer trusted SHA256 missing' }
          $actual = (Get-FileHash -LiteralPath $oldSetup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($remote.Trim().ToLowerInvariant() -ne ('sha256:' + $actual)) { throw 'Prior release SHA256 mismatch' }
          $old = Start-Process -FilePath $oldSetup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -PassThru -Wait
          if ($old.ExitCode -ne 0) { throw '14.2.0 install failed' }

          $exe = Join-Path $appDir 'Falcon Ai.exe'
          $helper = Join-Path $appDir '_internal\app_update_restart.ps1'
          $verfile = Join-Path $appDir '_internal\RELEASE_VERSION.txt'
          if ((Get-Content -LiteralPath $verfile -Raw).Trim() -ne '14.2.0') {
            throw 'Could not install prior 14.2.0 release before update'
          }
          if (-not (Test-Path -LiteralPath $helper)) { throw 'Previous installer update helper missing' }
          $dataDir = Join-Path $env:LOCALAPPDATA 'FalconAI'
          New-Item -Path $dataDir -ItemType Directory -Force | Out-Null
          $keep = Join-Path $dataDir 'ci_private_data_keep.txt'
          'Do not delete private user data on upgrade' | Set-Content -LiteralPath $keep
          $stage = Join-Path $dataDir 'installer_updates\falcon_ai_1430_ci'
          New-Item -Path $stage -ItemType Directory -Force | Out-Null
          Copy-Item -LiteralPath $newSetup -Destination (Join-Path $stage 'Falcon_Ai_Setup.exe') -Force
          $log = Join-Path $dataDir 'logs\app_installer_update.log'
          if (Test-Path -LiteralPath $log) { Remove-Item -LiteralPath $log -Force }
          $runner = Start-Process -FilePath powershell.exe -ArgumentList @(
            '-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass',
            '-File',('"' + $helper + '"'),'-WaitPid','999999',
            '-Installer',('"' + (Join-Path $stage 'Falcon_Ai_Setup.exe') + '"'),
            '-AppExe',('"' + $exe + '"')
          ) -PassThru
          Wait-Process -Id $runner.Id -Timeout 150 -ErrorAction Stop
          $runner.Refresh()
          if ($runner.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 20 }
            throw ('Upgrade/relaunch helper failed with exit ' + $runner.ExitCode)
          }
          if (-not (Test-Path -LiteralPath $keep)) { throw 'Upgrader deleted local data' }
          if ((Get-Content -LiteralPath $verfile -Raw).Trim() -ne '14.3.0') {
            throw 'Upgrade did not install version 14.3.0'
          }
          $events = Get-Content -LiteralPath $log -Raw
          Write-Host $events
          if (-not $events.Contains('Installer exit code 0') -or -not $events.Contains('New Falcon Ai application is running')) {
            throw 'Upgrade was not confirmed to install and auto-relaunch'
          }
          $selftest = Start-Process -FilePath $exe -ArgumentList '--falcon-self-test' -PassThru -Wait
          if ($selftest.ExitCode -ne 0) { throw 'Upgraded Windows app self-test failed' }
          $foundation = Start-Process -FilePath $exe -ArgumentList '--falcon-foundation-self-test' -PassThru -Wait
          if ($foundation.ExitCode -ne 0) { throw 'Upgraded V14 foundation self-test failed' }
          $money = Start-Process -FilePath $exe -ArgumentList '--falcon-money-self-test' -PassThru -Wait
          if ($money.ExitCode -ne 0) { throw 'Upgraded Money Mode self-test failed' }
          $store = Start-Process -FilePath $exe -ArgumentList '--falcon-store-self-test' -PassThru -Wait
          if ($store.ExitCode -ne 0) { throw 'Upgraded Payhip Store self-test failed' }
          $shorts = Start-Process -FilePath $exe -ArgumentList '--falcon-shorts-self-test' -PassThru -Wait
          if ($shorts.ExitCode -ne 0) { throw 'Packaged Shorts self-test failed' }
          Write-Host 'PASS: verified 14.2.0 -> 14.3.0, auto-reopened Falcon Ai, preserved user data'
      - name: Retain verified installer with exact source and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer='output/Falcon_Ai_Setup.exe'
          $hash=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Item -LiteralPath $installer).Length -lt 5000000) { throw 'Installer unexpectedly small' }
          $hash | Set-Content -LiteralPath 'output/Falcon_Ai_Setup.sha256' -Encoding ascii
          git rev-parse HEAD | Set-Content -LiteralPath 'output/SOURCE_COMMIT.txt' -Encoding ascii
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify source commit' }
      - uses: actions/upload-artifact@v4
        with:
          name: falcon-v143-verified-candidate
          path: |
            output/Falcon_Ai_Setup.exe
            output/Falcon_Ai_Setup.sha256
            output/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish only the exact verified V14.3 installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $existing=@(gh api repos/Falcomam/FalconAI-Releases/releases --paginate --jq '.[] | select(.tag_name == "v14.3.0") | .id')
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release absence' }
          if ($existing.Count -ne 0) { throw 'V14.3.0 draft or public release already exists; refusing overwrite' }
          $installer='output/Falcon_Ai_Setup.exe'
          $hash=(Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne (Get-Content -LiteralPath 'output/Falcon_Ai_Setup.sha256' -Raw).Trim()) { throw 'Candidate digest changed' }
          if ($env:GITHUB_SHA -ne (Get-Content -LiteralPath 'output/SOURCE_COMMIT.txt' -Raw).Trim()) { throw 'Candidate source identity changed' }
          @'
          Falcon AI V14.3.0 - Shorts Money Mode (early operational release)

          Retains V14.2 Payhip, approved website preview, existing project tools, local data and trusted in-app updater.
          New: automatic startup report, one local draft per day, Money Mode menu, preview, reviewed YouTube upload/scheduling and manual Studio handoff.
          Original procedural cartoon art with AI-assisted story generation, local Windows narration and synchronized captions. This is not diffusion video or guaranteed revenue.
          Requires Ollama with an installed model, FFmpeg and ffprobe on PATH (use Money Mode setup help), and Google desktop OAuth for API uploads. Manual Studio handoff is available without custom OAuth.
          Automatic local drafts run only when opted in, while Falcon is open and Gaming Mode is off. Public publishing requires review and approval. Real channel authorization and actual hardware performance remain to be tested by the owner. Check commercial rights to the selected voice before publishing.
          Native CI verifies the source tests, real Windows fixture narration and render, frozen imports, clean installation, upgrade from V14.2.0, relaunch and user-data preservation. The installer is unsigned.
          '@ | Set-Content -Encoding utf8 release_notes.txt
          gh release create v14.3.0 $installer --target $env:GITHUB_SHA --draft --title 'Falcon AI V14.3.0 - Shorts Money Mode' --notes-file release_notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
          $ids=@(gh api repos/Falcomam/FalconAI-Releases/releases --paginate --jq '.[] | select(.tag_name == "v14.3.0" and .draft == true) | .id')
          if ($LASTEXITCODE -ne 0 -or $ids.Count -ne 1 -or $ids[0] -notmatch '^[0-9]+$') { throw 'Cannot uniquely identify draft release' }
          $id=$ids[0]
          $raw=gh api "repos/Falcomam/FalconAI-Releases/releases/$id"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect draft release' }
          $draft=$raw | ConvertFrom-Json
          $assets=@($draft.assets | Where-Object { $_.name -eq 'Falcon_Ai_Setup.exe' })
          if (-not $draft.draft -or $draft.tag_name -ne 'v14.3.0' -or $draft.target_commitish -ne $env:GITHUB_SHA -or $assets.Count -ne 1 -or $assets[0].digest -ne ('sha256:'+$hash)) { throw 'Draft identity or installer digest mismatch; do not publish' }
          gh api --method PATCH "repos/Falcomam/FalconAI-Releases/releases/$id" -F draft=false -f make_latest=true --silent
          if ($LASTEXITCODE -ne 0) { throw 'Draft publication failed' }
          $remote=gh api repos/Falcomam/FalconAI-Releases/releases/tags/v14.3.0 --jq '.assets[] | select(.name == "Falcon_Ai_Setup.exe") | .digest'
          if ($LASTEXITCODE -ne 0 -or -not $remote -or $remote.Trim().ToLowerInvariant() -ne ('sha256:'+$hash)) { throw 'Public release digest verification failed' }
          Write-Host ('PASS: Falcon V14.3.0 published with verified SHA256 '+$hash)
