name: Validate Falcon Ai one-chat coding and engine candidate
on:
  push:
    branches: [main]
    paths:
      - "packaging/developer_chat.py"
      - "packaging/prepare_single_chat_candidate.py"
      - "packaging/tests/test_developer_chat.py"
      - ".github/workflows/validate-single-chat-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-chat-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Developer Mode, model selector, and workspace safety
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s packaging/tests -p 'test_developer*.py' -v
          python -m unittest discover -s packaging/tests -p test_engine_manager.py -v
      - name: Reconstruct, stage and compile candidate without releasing
        shell: bash
        run: |
          set -euo pipefail
          for patch in v13.6 v13.6.1 v13.6.2 v13.6.3 v13.6.4 v13.6.5; do
            python "patches/$patch/apply.py"
          done
          python packaging/prepare.py
          python -m pip install 'Pillow>=11.0'
          python packaging/prepare_icon_release.py
          python packaging/prepare_engine_candidate.py
          python packaging/prepare_single_chat_candidate.py
          python -m compileall -q build/Falcon_Ai_SingleChat_Candidate
          python -m py_compile build/falcon_app_1371_runtime/app_entry_engine_candidate.py
          python - <<'PY'
          from pathlib import Path
          root=Path('build/Falcon_Ai_SingleChat_Candidate')
          ui=(root/'falcon.py').read_text(encoding='utf-8')
          assert "self.dev_chat = developer_chat.ChatFeatures(self)" in ui
          assert "if self.dev_chat.dispatch(prompt):" in ui
          assert "self.dev_chat.stop()" in ui
          assert "command=lambda: self.submit_command('/engine status')" in ui
          assert "command=lambda: self.submit_command('/engine list')" in ui
          assert "command=lambda: self.submit_command('/engine start')" in ui
          assert "Create multi-file project" in ui
          assert (root/'developer_chat.py').is_file()
          assert (root/'developer_workspace.py').is_file()
          assert (root/'engine_manager.py').is_file()
          assert (root/'RELEASE_VERSION.txt').read_text().strip()=='13.7.1'
          assert (Path('build/Falcon_Ai_App_V13_7_1')/'RELEASE_VERSION.txt').read_text().strip()=='13.7.1'
          assert 'Toplevel' not in (root/'developer_chat.py').read_text(encoding='utf-8')
          print('PASS: one Falcon chat, native model checks, approved inert project files')
          print('PASS: V13.7.1 release left unchanged; no installer published')
          PY
