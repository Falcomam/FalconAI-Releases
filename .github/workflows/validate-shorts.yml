name: Verify Falcon Shorts source
on:
  push:
    paths:
      - 'packaging/shorts*.py'
      - 'packaging/ltx_video.py'
      - 'packaging/comfy_video.py'
      - 'packaging/video_workflow.py'
      - 'packaging/stage_shorts.py'
      - 'packaging/tests/provision_windows_media.ps1'
      - 'packaging/developer_chat.py'
      - 'packaging/tests/test_shorts*.py'
      - '.github/workflows/validate-shorts.yml'
  workflow_dispatch:
jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/tests/provision_windows_media.ps1
      - run: ffmpeg -version
      - run: ffprobe -version
      - run: python -m py_compile packaging/shorts_timing.py packaging/shorts_mode.py packaging/shorts_schedule.py packaging/shorts_visuals.py packaging/shorts_upload.py packaging/shorts_report.py packaging/developer_chat.py
      - run: python -m unittest discover -s packaging/tests -p "test_shorts*.py" -v
