name: Validate Falcon Money Mode source
on:
  push:
    branches: [main]
    paths:
      - "packaging/money_mode.py"
      - "packaging/payhip_store.py"
      - "packaging/website_preview.py"
      - "packaging/prepare_v142_store_candidate.py"
      - "packaging/money_integrations.py"
      - "packaging/customer_faq.py"
      - "packaging/tests/test_money_mode.py"
      - "packaging/tests/test_payhip_store.py"
      - "packaging/tests/test_website_preview.py"
      - "packaging/tests/test_money_integrations.py"
      - "packaging/tests/test_customer_faq.py"
      - "packaging/tests/test_money_mode_chat.py"
      - "packaging/prepare_money_mode_candidate.py"
      - "packaging/prepare_agent_coding_candidate.py"
      - ".github/workflows/validate-money-mode.yml"
  pull_request:
    paths:
      - "packaging/money_mode.py"
      - "packaging/payhip_store.py"
      - "packaging/website_preview.py"
      - "packaging/prepare_v142_store_candidate.py"
      - "packaging/money_integrations.py"
      - "packaging/tests/test_money_mode.py"
      - "packaging/tests/test_payhip_store.py"
      - "packaging/tests/test_website_preview.py"
      - "packaging/tests/test_money_integrations.py"
      - "packaging/tests/test_customer_faq.py"
      - "packaging/tests/test_money_mode_chat.py"
      - "packaging/prepare_money_mode_candidate.py"
      - "packaging/prepare_agent_coding_candidate.py"
      - ".github/workflows/validate-money-mode.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Money Mode unit tests
        shell: bash
        run: |
          python -m unittest discover -s packaging/tests -p test_money_mode.py -v
          python -m unittest discover -s packaging/tests -p test_payhip_store.py -v
          python -m unittest discover -s packaging/tests -p test_website_preview.py -v
          python -m unittest discover -s packaging/tests -p test_money_integrations.py -v
          python -m unittest discover -s packaging/tests -p test_customer_faq.py -v
          python -m compileall -q packaging/money_mode.py packaging/money_integrations.py packaging/customer_faq.py packaging/prepare_money_mode_candidate.py
  staged-chat:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct the existing Falcon V14 development candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'Pillow>=11.0'
          for patch in v13.6 v13.6.1 v13.6.2 v13.6.3 v13.6.4 v13.6.5; do
            python "patches/$patch/apply.py"
          done
          for script in \
            prepare.py prepare_icon_release.py prepare_engine_candidate.py \
            prepare_single_chat_candidate.py prepare_v138_release.py \
            prepare_copy_reply_candidate.py prepare_command_palette_candidate.py \
            prepare_web_quality_candidate.py prepare_project_revision_candidate.py \
            prepare_project_browser_candidate.py prepare_next_bundle_windows.py \
            prepare_project_search_candidate.py prepare_quiet_powershell_candidate.py \
            prepare_packaged_health_candidate.py finalize_packaged_health_release.py \
            prepare_v14_release_candidate.py prepare_agent_coding_candidate.py \
            prepare_money_mode_candidate.py prepare_v141_money_release_candidate.py \
            prepare_v142_store_candidate.py; do
            python "packaging/$script"
          done
      - name: Verify Money Mode live chat routing and review gate
        shell: bash
        run: |
          python -m unittest discover -s packaging/tests -p test_money_mode_chat.py -v
          python -m compileall -q build/Falcon_Ai_V14_2_Candidate
          python - <<'PY'
          import sys
          from pathlib import Path
          source=Path("build/Falcon_Ai_V14_2_Candidate").resolve()
          sys.path.insert(0,str(source))
          import developer_chat as d
          assert d.route("/money payhip") == ("money_mode", "payhip")
          assert d.route("/project preview example_site") == ("project_preview","example_site")
          assert "payhip_store" in (source/"developer_chat.py").read_text(encoding="utf-8")
          print("Payhip and auto-preview command routes verified")
          PY
